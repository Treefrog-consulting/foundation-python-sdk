[project]
name = "foundation-platform-sdk"
dynamic = ["version"]
description = "Python SDK for the Foundation Platform API"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [
    {name = "Sergey Kovalev", email = "sergey.kovalev@treefrogconsulting.com"}
]
keywords = ["foundation", "platform", "api", "sdk", "insurance", "reinsurance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0",
]

# Reading deals, layers, reference data, versions and custom fields needs only
# requests. The DataFrame stack is 150-500 MB and is pulled in only by the
# accessor a caller actually uses; every one of them raises an ImportError
# naming the extra to install.
[project.optional-dependencies]
# duckdb alone serves the loss-export download and the single-metric lookups
# (metric_results.get_by_name / get_by_id / get_by_source_name), which read
# scalars straight out of the export and need no DataFrame library.
# Below 2.0: DuckDB 2.0 dropped .pl() from execute() results, which every
# as_polars() over the export calls.
duckdb = [
    "duckdb>=1.0.0,<2",
]
pandas = [
    "foundation-platform-sdk[duckdb]",
    "pandas>=2.2.2",
]
# pyarrow is not optional for polars output: duckdb's .pl() goes through Arrow.
polars = [
    "foundation-platform-sdk[duckdb]",
    "polars>=1.0.0",
    "pyarrow>=22.0.0",
]
all = [
    "foundation-platform-sdk[pandas,polars]",
]

[project.urls]
Homepage = "https://www.foundationplatform.com"
Documentation = "https://docs.foundationplatform.com/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version; it was duplicated here and in
# foundation/__init__.py and had to be kept in step by hand.
[tool.hatch.version]
path = "foundation/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["foundation"]

# PEP 735. The duplicate [project.optional-dependencies].dev block this
# replaced published the test tooling as an installable extra of the SDK.
[dependency-groups]
dev = [
    "foundation-platform-sdk[all]",
    "pytest>=8.0.0",
    "requests-mock>=1.12.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade — PEP 585/604 modern typing
    "B",      # bugbear
    "BLE",    # blind except
    "DTZ",    # naive datetime
    "RUF",
]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests construct partial objects and assert on broad failures by design.
"tests/*" = ["B017", "B018"]
# These take the fixtures they import from test_portfolio_templates as arguments.
"tests/test_portfolio_runs.py" = ["F811"]
"tests/test_portfolio_scenarios.py" = ["F811"]
